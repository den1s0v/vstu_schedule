[project]
name = "vstu-schedule"
version = "0.1.1"
description = "Unified VSTU Schedule project"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "openpyxl>=3.1.5",
    "requests>=2.32.0",
    "xls2xlsx>=0.2.0",
    "celery[redis]>=5.6.3",
    "django>=6.1,<6.2",
    "django-celery-beat>=2.9.0",
    "gunicorn>=23.0.0",
    "psycopg>=3.3.2",
    "psycopg[binary,pool]>=3.3.0",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "vstu-xls",
    "xlsxwriter>=3.2.9",
    "xxhash>=3.7.0",
    "rapidfuzz>=3.14.5",
    "django-modern-rest[jwt,msgspec,openapi]>=0.17.0",
    "icalendar>=7.1.2",
    "markdown-it-py>=4.2.0",
]
[dependency-groups]
dev = [
    "django-stubs>=6.0.3",
    "django-stubs-ext>=6.0.3",
    "pyright>=1.1.409",
    "pytest>=9.0.2",
    "pytest-django>=4.11.1",
    "ruff>=0.15.15",
]

[tool.pyright]
typeCheckingMode = "standard"
pythonVersion = "3.13"
include = ["apps", "vstu_schedule"]
exclude = [
    "**/migrations",
    "**/__pycache__",
    ".venv", "**/node_modules", "**/.*",
]

[tool.uv.sources]
django-celery-beat = { git = "https://github.com/celery/django-celery-beat.git", rev = "492719f67c9c886fd38a7ba7e9754c914bb7497f" }
vstu-xls = { git = "https://github.com/den1s0v/vstu_xls.git", rev = "0.2.2-preview" }
