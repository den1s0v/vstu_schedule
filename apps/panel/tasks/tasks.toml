["panel.tasks.dispatch_configured_task"]
internal = true
concurrency = "parallel"
name = { ru = "Диспетчер настроенных задач", en = "Configured task dispatcher" }
description = { ru = "Внутренняя задача, которая запускает пользовательские задачи с актуальными настройками панели.", en = "Internal task that queues panel-managed tasks with the latest runtime settings." }

["panel.tasks.run_panel_action"]
internal = true
concurrency = "parallel"
name = { ru = "Действие панели управления", en = "Control panel action" }
description = { ru = "Внутренняя короткоживущая задача для выполнения действий панели вне HTTP-запроса.", en = "Internal short-lived task for executing control panel actions outside the HTTP request." }

["panel.tasks.update_timetable"]
concurrency = "exclusive"
name = { ru = "Обновление расписания", en = "Timetable update" }
description = { ru = "Скачивает файлы расписания, сравнивает версии и сохраняет новые файлы в локальное хранилище.", en = "Downloads timetable files, compares versions and stores changed files locally." }
soft_time_limit_seconds = 1800
time_limit_seconds = 3600
recommended_schedule = { minute = "0", hour = "*/6", day_of_week = "*", day_of_month = "*", month_of_year = "*" }

["panel.tasks.import_saved_timetables"]
concurrency = "exclusive"
name = { ru = "Импорт и разбор сохранённых расписаний", en = "Import and parse stored timetables" }
description = { ru = "Разбирает уже сохранённые xls/xlsx-файлы и импортирует новые расписания в базу данных.", en = "Parses already stored xls/xlsx files and imports new schedules into the database." }
soft_time_limit_seconds = 1800
time_limit_seconds = 3600

[["panel.tasks.import_saved_timetables".parameters]]
name = "academic_year"
type = "str"
required = true
label = { ru = "Учебный год", en = "Academic year" }
description = { ru = "Например: 2025-2026.", en = "For example 2025-2026." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "semester"
type = "int"
required = true
label = { ru = "Семестр", en = "Semester" }
description = { ru = "Номер семестра.", en = "Semester number." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "semester_start_date"
type = "date"
required = true
label = { ru = "Дата начала семестра", en = "Semester start date" }
description = { ru = "Дата начала семестра.", en = "Semester start date." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "semester_end_date"
type = "date"
required = true
label = { ru = "Дата окончания семестра", en = "Semester end date" }
description = { ru = "Дата окончания семестра.", en = "Semester end date." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "starting_day_number"
type = "int"
default = 0
label = { ru = "Начальный номер дня", en = "Starting day number" }
description = { ru = "Смещение AbstractDay для начала семестра.", en = "AbstractDay offset for semester start." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "changed_only"
type = "bool"
default = true
label = { ru = "Только изменённые", en = "Changed only" }
description = { ru = "Пропускать уже импортированные записи FileVersion.", en = "Skip already imported FileVersion records." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "save_archive_schedules"
type = "bool"
default = true
label = { ru = "Сохранять архивные расписания", en = "Keep archive schedules" }
description = { ru = "Не удалять старые архивные расписания.", en = "Do not delete old archive schedules." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "resource_ids"
type = "str"
default = ""
label = { ru = "ID ресурсов", en = "Resource IDs" }
description = { ru = "Необязательный список ID ресурсов через запятую.", en = "Optional comma-separated resource ids." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "use_corrections"
type = "str"
default = ""
label = { ru = "Использовать корректировки L1–L3", en = "Use L1–L3 corrections" }
description = { ru = "Пусто — взять IMPORT_USE_CORRECTIONS из env. 1/true — включить, 0/false — выключить.", en = "Empty uses IMPORT_USE_CORRECTIONS from env. 1/true enables, 0/false disables." }

[["panel.tasks.import_saved_timetables".parameters]]
name = "corrections_strict"
type = "str"
default = ""
label = { ru = "Строгий режим корректировок", en = "Strict corrections mode" }
description = { ru = "Пусто — IMPORT_CORRECTIONS_STRICT из env. 1 — не создавать сущности при неоднозначности.", en = "Empty uses IMPORT_CORRECTIONS_STRICT from env. 1 skips unresolved entities." }

["panel.tasks.clear_storage"]
concurrency = "exclusive"
name = { ru = "Очистка хранилища", en = "Storage cleanup" }
description = { ru = "Очищает выбранный компонент системы. Для ручного запуска нужны аргументы, поэтому задача отображается только для настройки и просмотра логов.", en = "Clears a selected system component. It requires arguments for manual runs, so it is shown for configuration and logs only." }
soft_time_limit_seconds = 600
time_limit_seconds = 900

["panel.tasks.delete_revoked_api_clients"]
concurrency = "exclusive"
name = { ru = "Удалить отозванных API-клиентов", en = "Delete revoked API clients" }
description = { ru = "Удаляет API-клиентов, которые уже отозваны. Автозапуск по умолчанию не включен.", en = "Deletes API clients that have already been revoked. No automatic schedule is enabled by default." }
soft_time_limit_seconds = 300
time_limit_seconds = 600
